  description:
    - |
      This dataset contains all experimental and computational data associated with the autonomous Scanning Electrochemical Cell Microscopy (SECCM) platform described in the accompanying publication. The platform combines robotic SECCM with active learning and multi-output Gaussian process (GP) modeling for high-throughput electrochemical characterization of compositionally complex thin-film materials libraries, validated on the Au-Ir-Rh ternary system as a model case for hydrogen evolution reaction (HER) electrocatalyst discovery.

      Three Au-Ir-Rh thin-film materials libraries were fabricated by magnetron co-sputtering onto 100 mm diameter Sapphire wafers and are referred to throughout as Au-rich, Ir-rich, and Rh-rich according to their position in the ternary composition space. All characterization techniques share a unified measurement grid of 342 measurement areas distributed across each library at 4.5 mm spacing. A coordinates file providing the x, y positions of all 342 MAs is included.

      Dataset contents:

      Energy-Dispersive X-ray Spectroscopy (EDX) Volume compositions (Au, Ir, Rh in at.%) at all 342 MAs for each of the three libraries. Provided in .csv format.
      X-ray Photoelectron Spectroscopy (XPS) Due to the lower throughput of XPS, 13 localized surface composition measurements were performed per library. The full set of measurement areas were predicted using a Gaussian process regression model (method described here). Two files are provided per library: one containing the measured XPS compositions and one containing the GP-predicted values. In addition to Au, Ir, and Rh, the XPS dataset includes surface contents of oxygen (O), carbon (C), native Rh oxide, and Rh hydroxide. Provided in .csv format.
      X-ray Diffraction (XRD) Diffractograms (2θ position vs. intensity in counts) at all 342 areas for each library. Provided in .csv format.
      Atomic Force Microscopy (AFM) Raw data from 15 localized AFM measurements (5 per library), recorded in Bruker NanoScope raw data format. Representative images are shown in the Supporting Information of the accompanying paper.
      SECCM Linear sweep voltammograms (LSVs) acquired at each area for all three libraries. Due to collision risk of the environmental chamber, 20 areas per library were excluded, yielding 322 LSVs per library. Each LSV file contains three columns: potential vs. the reversible hydrogen electrode (RHE, in V), mean current density (in A/cm^2), and the standard deviation of the current density, computed from three individually recorded LSVs that are averaged per measurement area. An additional file contains the parameters extracted by fitting the averaged LSVs to an analytical equation described in the publication: the limiting current density I_lim (A/cm^2), the transfer coefficient α (dimensionless), and the standard rate constant k^0 (cm/s). Provided in .csv format.
      Active Learning Animations: Two animations (.mp4 format) illustrating the active learning process applied to the Au-Ir-Rh composition space. Each frame corresponds to one iteration of the algorithm and displays the current LSV data, the extracted fit parameters, the GP model predictions across the ternary space, and the acquisition function values used to select the next measurement. One animation corresponds to the baseline GP implementation; the second corresponds to the noise-aware GP variant, which incorporates per-area measurement uncertainty derived from the standard deviations of the individual LSV fit parameters prior to averaging.
      Measurement Video: (.mp4) of the measurement process of the first 400 measurements/training iterations. It shows the robotic transfer, the environmental chamber and visual capillary approach and the electrocatalytic measurements.

      Note - original raw file name is `Au-Ir-Rh_Au-rich_AFM_area_168.002`
