name: SPM image check

# Builds the pynxtools-spm image from this checkout and tests it; never pushes.
on:
  push:
    branches: ['release/**']
    paths: [CITATION.cff]
  pull_request:
    branches: ['release/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    uses: ./.github/workflows/spm-docker-build-test.yml
    with:
      source: local
