name: SPM image build

# Builds, checks and tests the pynxtools-spm image; pushes it only when `push` is true.
# Called by spm-docker-test.yml and spm-docker-publish.yml.
on:
  workflow_call:
    inputs:
      source:
        description: "local: build from the checkout; pypi: install the released version"
        type: string
        required: true
      ref:
        description: Commit to check out; empty for the commit of the event
        type: string
        default: ''
      push:
        description: Push :latest and :<version> to ghcr.io
        type: boolean
        default: false

env:
  DOCKERFILE: docker/Dockerfile

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Read CITATION.cff version and latest pynxtools
        id: versions
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          spm=$(sed -n 's/^version:[[:space:]]*//p' CITATION.cff | tr -d "\"'")
          pypi_pynx=$(curl -fsS https://pypi.org/pypi/pynxtools/json | jq -r .info.version)
          {
            echo "spm=$spm"
            echo "pypi_pynx=$pypi_pynx"
            # Registry names must be lowercase.
            echo "image=ghcr.io/${OWNER,,}/pynxtools-spm:${spm}"
          } >> "$GITHUB_OUTPUT"

      # PyPI can take a few minutes to list a new release.
      - name: Wait for pynxtools-spm on PyPI
        if: inputs.source == 'pypi'
        env:
          SPM: ${{ steps.versions.outputs.spm }}
        run: |
          for _ in $(seq 30); do
            curl -fsS -o /dev/null "https://pypi.org/pypi/pynxtools-spm/${SPM}/json" && exit 0
            sleep 60
          done
          echo "::error::pynxtools-spm $SPM is not on PyPI after 30 minutes."
          exit 1

      - uses: docker/setup-buildx-action@v3

      # pynxtools is pinned to the latest, so a new pynxtools that breaks the image fails here.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          build-args: |
            PYNXTOOLS_SPM_SOURCE=${{ inputs.source }}
            PYNXTOOLS_SPM_VERSION=${{ steps.versions.outputs.spm }}
            PYNXTOOLS_VERSION=${{ steps.versions.outputs.pypi_pynx }}
          tags: ${{ steps.versions.outputs.image }}
          labels: io.github.fairmat-nfdi.pynxtools.version=${{ steps.versions.outputs.pypi_pynx }}
          load: true

      # packaging.version orders pre-releases right (0.5.0rc1 < 0.5.0); `sort -V` does not.
      - name: Check latest versions
        env:
          IMAGE: ${{ steps.versions.outputs.image }}
          SPM: ${{ steps.versions.outputs.spm }}
          LATEST_PYNX: ${{ steps.versions.outputs.pypi_pynx }}
        run: |
          PYPI_SPM=$(curl -fsS https://pypi.org/pypi/pynxtools-spm/json | jq -r .info.version)
          docker run --rm -i -e SPM -e PYPI_SPM="$PYPI_SPM" -e LATEST_PYNX "$IMAGE" python - <<'EOF'
          import os, sys
          from importlib.metadata import version
          from packaging.version import Version

          spm, pypi_spm, latest_pynx = (os.environ[k] for k in ("SPM", "PYPI_SPM", "LATEST_PYNX"))
          errors = []
          # Equal (released) or newer (release branch before publishing).
          if Version(spm) < Version(pypi_spm):
              errors.append(f"CITATION.cff has {spm}, but PyPI has the newer pynxtools-spm {pypi_spm}.")
          if Version(version("pynxtools")) != Version(latest_pynx):
              errors.append(f"Image has pynxtools {version('pynxtools')}; PyPI has {latest_pynx}.")
          for error in errors:
              print(f"::error::{error}")
          sys.exit(bool(errors))
          EOF

      - name: Smoke test like Galaxy tool
        env:
          IMAGE: ${{ steps.versions.outputs.image }}
        run: |
          # A non-root --user and a program as the command, as Galaxy runs it.
          docker run --rm --user 1001:1001 "$IMAGE" python -c "import yaml, pynxtools_spm"

          # Options only: the entrypoint adds `pynx convert`.
          docker run --rm --user 1001:1001 "$IMAGE" --help > /dev/null

      # Compares the output with the reference NeXus file, so a pynxtools change is found.
      - name: Reader test in the image
        env:
          IMAGE: ${{ steps.versions.outputs.image }}
        run: |
          docker run --rm -v "$PWD/tests:/tests:ro" "$IMAGE" sh -c \
            "pip install -q --root-user-action=ignore --disable-pip-version-check pytest &&
             pytest /tests/test_reader.py -k v_gen_4_dflt_conf_down -p no:cacheprovider"

      # Pushes the tested image; no rebuild. :latest first, so an existing :<version>
      # means :latest was pushed too.
      - name: Log in to ghcr.io and push
        if: inputs.push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          IMAGE: ${{ steps.versions.outputs.image }}
        run: |
          echo "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          latest="${IMAGE%:*}:latest"
          docker tag "$IMAGE" "$latest"
          docker push "$latest"
          docker push "$IMAGE"
