    name: Dibromodiamantane
  name: Dibromodiamantane
default: current_forward
definition: NXstm
experiment_description: |
  Clean Au(111)/mica substrates were prepared by Ar⁺ sputtering (1 kV, 10 mA) and 
  annealing at 723 K under UHV. 4,9-Dibromodiamantane molecules were deposited from a 
  room-temperature glass crucible onto Au(111) held at 178 K. The molecular layer was 
  subsequently irradiated with Al Kα X-rays (260 W, source–sample distance 1.5 cm) for 
  cumulative exposure times of 1.5–10 h to induce C–Br bond dissociation and molecular 
  coupling. STM measurements were performed under UHV using a CreaTec 1 K SPM at 77 K 
  or 4 K with Pt/Ir tips, operating in constant-current
experiment_technique: STM
identifier_collection: 20230829_016
identifier_experiment: Dibromodiamantane_4K-STM_Current_20230829_016.sxm
scan_mode: constant current
