  description:
    - |
      This dataset contains scanning tunneling microscope (STM) data of single crystal tungsten diselenide (WSe2) provided by the Hone-Barmak Group acquired in constant current mode from two STM systems: a Low Temperature STM (LT-STM) and a room temperature STM (RT-STM). The images are of various sizes and resolutions. 136 of the STM images have associated labels of atomic-scale defects in the form of bouding boxes and image label masks. 38 annotated images were selected to construct an augmented training dataset of images and label masks saved as numpy files for convientent model training. Original, raw STM data of WSe2 is also inculded.

      Code on GitHub: <https://github.com/darianSmalley/ML-STM>

      Note - original raw file name is `STM_WTip_WSe2-SL445_056.sxm`
